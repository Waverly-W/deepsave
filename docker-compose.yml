services:
  db:
    image: pgvector/pgvector:pg16
    profiles: ["cpu", "gpu"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: deepsave
      POSTGRES_PASSWORD: deepsave
      POSTGRES_DB: deepsave
    volumes:
      - ./db/init/00-init-extensions.sql:/docker-entrypoint-initdb.d/00-init-extensions.sql:ro
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:10132:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepsave"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    profiles: ["cpu", "gpu"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:10179:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    build:
      context: ./backend
    profiles: ["cpu", "gpu"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://deepsave:deepsave@db:5432/deepsave
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      APP_SECRET_KEY: ${APP_SECRET_KEY?required}
      ARTIFACTS_BASE_DIR: /data/artifacts
      ALIYUN_API_KEY: ${ALIYUN_API_KEY}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://127.0.0.1:10100,http://localhost:10100}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - artifacts_data:/data/artifacts
    ports:
      - "0.0.0.0:10156:8356"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8356/health/readiness', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    cpus: "2.0"
    mem_limit: "2g"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    build:
      context: ./backend
    profiles: ["cpu", "gpu"]
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://deepsave:deepsave@db:5432/deepsave
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      APP_SECRET_KEY: ${APP_SECRET_KEY?required}
      ARTIFACTS_BASE_DIR: /data/artifacts
      ALIYUN_API_KEY: ${ALIYUN_API_KEY}
    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - artifacts_data:/data/artifacts
    cpus: "2.0"
    mem_limit: "2g"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  beat:
    build:
      context: ./backend
    profiles: ["cpu", "gpu"]
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://deepsave:deepsave@db:5432/deepsave
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      APP_SECRET_KEY: ${APP_SECRET_KEY?required}
      ARTIFACTS_BASE_DIR: /data/artifacts
      ALIYUN_API_KEY: ${ALIYUN_API_KEY}
    depends_on:
      backend:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
    cpus: "0.5"
    mem_limit: "512m"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
    profiles: ["cpu", "gpu"]
    restart: unless-stopped
    environment:
      API_BASE_URL: http://backend:8356
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
      NEXT_PUBLIC_API_PORT: ${NEXT_PUBLIC_API_PORT:-10156}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://127.0.0.1:10100}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    ports:
      - "0.0.0.0:10100:3000"
    depends_on:
      backend:
        condition: service_healthy
    cpus: "1.5"
    mem_limit: "1g"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  ollama:
    image: ollama/ollama:latest
    profiles: ["gpu"]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:10134:11434"

volumes:
  pg_data:
  redis_data:
  artifacts_data:
  ollama:
